[project]
name = "bourse"
version = "0.1.0"
description = "A paper-trading simulator for the S&P 500, with a terminal dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["trading", "stocks", "paper-trading", "portfolio", "finance", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.79",
    "textual-plotext>=0.2.1",
]

[project.scripts]
bourse = "bourse.cli:main"

[project.urls]
Homepage = "https://github.com/conflictednerd/bourse"
Repository = "https://github.com/conflictednerd/bourse"
Issues = "https://github.com/conflictednerd/bourse/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bourse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
